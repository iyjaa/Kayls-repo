name: Build APT Repository

on:
  push:
    branches: [main]
    paths:
      - 'pool/**/*.deb'
      - 'apt-key.asc'
      - '.github/workflows/apt-repo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          fingerprint: ${{ secrets.GPG_KEY_ID }}

      - name: Generate Packages for amd64
        run: |
          mkdir -p dists/stable/main/binary-amd64
          if [ -n "$(find pool -name '*_amd64.deb' -print -quit)" ]; then
            dpkg-scanpackages -a amd64 pool/ /dev/null > dists/stable/main/binary-amd64/Packages
          else
            touch dists/stable/main/binary-amd64/Packages
          fi
          gzip -kf dists/stable/main/binary-amd64/Packages

      - name: Generate Packages for arm64
        run: |
          mkdir -p dists/stable/main/binary-arm64
          if [ -n "$(find pool -name '*_arm64.deb' -print -quit)" ]; then
            dpkg-scanpackages -a arm64 pool/ /dev/null > dists/stable/main/binary-arm64/Packages
          else
            touch dists/stable/main/binary-arm64/Packages
          fi
          gzip -kf dists/stable/main/binary-arm64/Packages

      - name: Generate Release
        run: |
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Tscode" \
            -o APT::FTPArchive::Release::Label="Tscode" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            release dists/stable > dists/stable/Release

      - name: Sign Release
        run: |
          gpg --batch --yes --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4